[project]
name = "language-review"
version = "0.1.0"
description = "Инвентаризация текстовых файлов для последующего языкового ревью"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pathspec>=1.1.1",
]

[project.scripts]
language-review = "language_review.cli:main"

[dependency-groups]
dev = [
    "markdown-it-py>=4.2.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruamel-yaml>=0.19.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build==0.12.20"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.1"

[tool.uv.build-backend]
module-name = "language_review"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.15"
mypy_path = "src"
strict = true
files = ["src/language_review"]
