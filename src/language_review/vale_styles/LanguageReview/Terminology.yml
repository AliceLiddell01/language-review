# Разговорные и жаргонные заимствования в русском техническом тексте.
# Каждая форма слова сопоставлена той же форме замены, чтобы предложение не ломало согласование.
extends: substitution
message: "Терминология: используйте %s вместо «%s»."
level: warning
ignorecase: true
action:
  name: replace
swap:
  юзер: пользователь
  юзера: пользователя
  юзеру: пользователю
  юзером: пользователем
  юзере: пользователе
  юзеры: пользователи
  юзеров: пользователей
  юзерам: пользователям
  юзерами: пользователями
  юзерах: пользователях
  апдейт: обновление
  апдейта: обновления
  апдейту: обновлению
  апдейтом: обновлением
  апдейте: обновлении
  апдейты: обновления
  апдейтов: обновлений
  апдейтам: обновлениям
  апдейтами: обновлениями
  апдейтах: обновлениях
  фича: функция
  фичи: функции
  фиче: функции
  фичу: функцию
  фичей: функцией
  фич: функций
  фичам: функциям
  фичами: функциями
  фичах: функциях
  кликнуть: нажать
  кликните: нажмите
  кликни: нажми
  кликнул: нажал
  кликнула: нажала
  кликнули: нажали
  кликать: нажимать
  кликайте: нажимайте
  залогиниться: войти
  залогиньтесь: войдите
  залогинился: вошёл
  залогинилась: вошла
  залогинились: вошли
  разлогиниться: выйти
  разлогиньтесь: выйдите
