# Жаргонизмы без однозначной замены: исправление требует перестройки фразы.
extends: existence
message: "Жаргонизм «%s»: переформулируйте, например «по умолчанию», «настройка»."
level: warning
ignorecase: true
tokens:
  - дефолтн\p{L}*
  - дефолт\p{L}*
  - конфиг(?:а|у|ом|е|и|ов|ам|ами|ах)?
  - засетап\p{L}*
