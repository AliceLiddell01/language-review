name: Проверка конфигурации Renovate
env:
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: 44.181.1

on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yml
  push:
    branches: [main]
    paths:
      - renovate.json
      - .github/workflows/renovate-config.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Строгая проверка Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Настроить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
      - name: Кэшировать пакеты Renovate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-renovate-cli-${{ env.RENOVATE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-renovate-cli-
      - name: Проверить схему и актуальность конфигурации
        shell: python
        run: |
          import os
          import subprocess
          command = [
              "npm", "exec", "--yes", f"--package=renovate@{os.environ['RENOVATE_VERSION']}",
              "--", "renovate-config-validator", "renovate.json", "--strict",
          ]
          raise SystemExit(subprocess.run(command, check=False).returncode)
