name: Релиз • ручная подготовка и отдельная публикация
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'prepare не создаёт тегов; publish требует отдельного решения'
        type: choice
        options: [prepare, publish]
        required: true
      version:
        description: 'Осмысленно выбранная SemVer версия (без v)'
        required: true
      channel:
        type: choice
        options: [stable, prerelease]
        required: true
      commit:
        description: 'Полный target SHA'
        required: true
      previous:
        description: 'Последний опубликованный stable tag или none'
        required: true
      notes:
        description: 'Путь notes в target commit, разделы по docs/releases.md'
        required: true
      candidate_run:
        description: 'Только publish: ID успешного prepare run'
      authorization:
        description: 'Только publish: publish vВЕРСИЯ ПОЛНЫЙ_SHA'
      notes_sha256:
        description: 'Только publish: подтверждённый SHA-256 release-notes.md'

permissions:
  contents: read
concurrency:
  group: language-review-release
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.operation == 'prepare'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
      - run: uv sync --locked
      - name: Подготовить из точного SHA без публичного тега
        env:
          GH_TOKEN: ${{ github.token }}
          LR_VERSION: ${{ inputs.version }}
          LR_CHANNEL: ${{ inputs.channel }}
          LR_COMMIT: ${{ inputs.commit }}
          LR_PREVIOUS: ${{ inputs.previous }}
          LR_NOTES: ${{ inputs.notes }}
        run: uv run --locked python scripts/release.py workflow-prepare
      - name: Проверить установку из кандидата в Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/release.py accept --candidate candidate --output acceptance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate
          path: |
            candidate/*
            acceptance.json
          retention-days: 14
          if-no-files-found: error

  publish:
    if: inputs.operation == 'publish' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    # Для production включить required reviewers в настройках GitHub Environment.
    environment: release-publication
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
      - run: uv sync --locked
      - name: Проверить происхождение candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          LR_CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: uv run --locked python scripts/release.py workflow-source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: prepared
      - name: Отдельно разрешённая публикация полного комплекта
        env:
          GH_TOKEN: ${{ github.token }}
          LR_RELEASE_AUTHORIZATION: ${{ inputs.authorization }}
          LR_NOTES_SHA256: ${{ inputs.notes_sha256 }}
          LR_VERSION: ${{ inputs.version }}
          LR_COMMIT: ${{ inputs.commit }}
          LR_CHANNEL: ${{ inputs.channel }}
          LR_PREVIOUS: ${{ inputs.previous }}
          LR_CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: uv run --locked python scripts/release.py workflow-publish
