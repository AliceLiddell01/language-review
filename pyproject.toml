[project]
name = "language-review"
version = "0.1.0"
description = "Инвентаризация текстовых файлов для последующего языкового ревью"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "jsonschema>=4.25",
    "markdown-it-py>=4.2.0",
    "pathspec>=1.1.1",
    "ruamel-yaml>=0.19.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-json>=0.24.8",
    "tree-sitter-powershell>=0.26.4",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-toml>=0.7.0",
    "tree-sitter-xml>=0.7.0",
    "tree-sitter-yaml>=0.7.2",
]

[project.scripts]
language-review = "language_review.cli:main"
language-review-eval = "language_review.evaluation.cli:main"

[project.optional-dependencies]
chatgpt = ["PyJWT[crypto]>=2.10.1"]
memory = [
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "PyJWT[crypto]>=2.10.1",
    "mypy>=2.4.0",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruamel-yaml>=0.19.1",
    "ruff>=0.17.1",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["uv_build==0.12.20"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.1"

[tool.uv.build-backend]
module-name = "language_review"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.15"
mypy_path = "src"
strict = true
files = ["src/language_review"]
