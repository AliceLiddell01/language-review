# Канцеляризмы, которые в техническом тексте обычно заменяются глаголом или предлогом.
extends: existence
message: "Канцелярит: «%s» — попробуйте выразить проще."
level: suggestion
ignorecase: true
tokens:
  - осуществля\p{L}*
  - осуществи\p{L}*
  - осуществлени\p{L}*
  - посредством
  - вышеуказанн\p{L}*
  - вышеизложенн\p{L}*
  - нижеследующ\p{L}*
  - имеет место
  - на сегодняшний день
  - в целях
